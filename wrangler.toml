name = "cftestsite"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "cftestsite-db"
database_id = "e680a366-9780-4739-9273-87588f659cb7"

[[kv_namespaces]]
binding = "KV"
id = "d48f91339d7c4a17a366a43f02a50375"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cftestsite-bucket"

[ai]
binding = "AI"

# Vectorize — semantic search over the demo posts.
# Binding is commented out so the site deploys cleanly before the index exists.
# To enable: create the index (768 dims matches @cf/baai/bge-base-en-v1.5),
# uncomment the block below, then redeploy and seed via /api/admin/reindex:
#   npx wrangler vectorize create cftestsite-vectors --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "cftestsite-vectors"

# Durable Objects — strongly-consistent global counter (see do-worker/).
# DO classes cannot live in a Pages project, so deploy do-worker/ first, then
# uncomment this binding (note the required script_name) and redeploy Pages:
#   cd do-worker && npx wrangler deploy
# [[durable_objects.bindings]]
# name = "LIVE_COUNTER"
# class_name = "LiveCounter"
# script_name = "cftestsite-do"

# Local dev only — replace values with your own or leave as test keys
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADAecJ5lJEFt1bmG"
# Secrets (set these in Pages dashboard, NOT here):
#   TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
#   WIPE_SECRET          = "some-random-secret-you-choose"
