name = "cftestsite"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "cftestsite-db"
database_id = "e680a366-9780-4739-9273-87588f659cb7"

[[kv_namespaces]]
binding = "KV"
id = "d48f91339d7c4a17a366a43f02a50375"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cftestsite-bucket"

[ai]
binding = "AI"

# Vectorize — semantic search over the demo posts (index: cftestsite-vectors,
# 768 dims / cosine, matching @cf/baai/bge-base-en-v1.5). Seed via
# POST /api/admin/reindex after the index is populated.
[[vectorize]]
binding = "VECTORIZE"
index_name = "cftestsite-vectors"

# Durable Objects — strongly-consistent global counter. The class lives in the
# standalone cftestsite-do Worker (see do-worker/), referenced by script_name
# since DO classes cannot be defined inside a Pages project.
[[durable_objects.bindings]]
name = "LIVE_COUNTER"
class_name = "LiveCounter"
script_name = "cftestsite-do"

# Local dev only — replace values with your own or leave as test keys
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAADAecJ5lJEFt1bmG"
# Secrets (set these in Pages dashboard, NOT here):
#   TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
#   WIPE_SECRET          = "some-random-secret-you-choose"
